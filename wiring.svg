<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .box{fill:#f7f7f7;stroke:#333;stroke-width:1.5}
    .pcb{fill:#e8f0e8;stroke:#2f6b2f;stroke-width:1.5}
    .rpi{fill:#e9f0fa;stroke:#2a4a7f;stroke-width:1.5}
    .mon{fill:#eee;stroke:#333;stroke-width:1.5}
    .title{font-size:15px;font-weight:bold}
    .sub{font-size:11px;fill:#555}
    .pin{fill:#fff;stroke:#333;stroke-width:1}
    .lbl{font-size:12px}
    .wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .w5v{stroke:#d62728}
    .wgnd{stroke:#111}
    .w17{stroke:#ff7f0e}
    .w27{stroke:#9467bd}
    .wgrn{stroke:#2ca02c}
    .worg{stroke:#f5a623}
    .wbrn{stroke:#8c564b}
    .wbw{stroke:#b98a6b;stroke-dasharray:6 4}
    .note{font-size:11.5px;fill:#333}
    .relay{fill:#fff;stroke:#2f6b2f;stroke-width:1.2}
  </style>

  <text x="20" y="28" class="title">JVC DT‑V17G1 tally — Raspberry Pi → RUNCCI‑YUN 4‑ch relay → REMOTE (MAKE/TRIGGER)</text>

  <!-- ================= Raspberry Pi ================= -->
  <rect x="20" y="60" width="210" height="300" rx="8" class="rpi"/>
  <text x="30" y="82" class="title">Raspberry Pi</text>
  <text x="30" y="98" class="sub">40‑pin header (relevant pins only)</text>

  <!-- header pins: physical, label -->
  <!-- phys 2: 5V -->
  <rect x="150" y="120" width="60" height="22" class="pin"/>
  <text x="158" y="135" class="lbl">2 · 5 V</text>
  <!-- phys 6: GND -->
  <rect x="150" y="160" width="60" height="22" class="pin"/>
  <text x="158" y="175" class="lbl">6 · GND</text>
  <!-- phys 11: GPIO17 -->
  <rect x="120" y="220" width="90" height="22" class="pin"/>
  <text x="128" y="235" class="lbl">11 · GPIO17</text>
  <!-- phys 13: GPIO27 -->
  <rect x="120" y="260" width="90" height="22" class="pin"/>
  <text x="128" y="275" class="lbl">13 · GPIO27</text>

  <text x="30" y="320" class="note">GPIO17 = TALLY on/off</text>
  <text x="30" y="336" class="note">GPIO27 = TALLY SEL (green)</text>

  <!-- ================= Relay board ================= -->
  <rect x="330" y="60" width="370" height="420" rx="8" class="pcb"/>
  <text x="340" y="82" class="title">RUNCCI‑YUN 4‑ch 5 V relay module</text>
  <text x="340" y="98" class="sub">B0FVLQLCXT · opto inputs · jumper set to H (high‑level trigger)</text>

  <!-- input header on left edge -->
  <rect x="330" y="120" width="50" height="22" class="pin"/><text x="336" y="135" class="lbl">DC+</text>
  <rect x="330" y="160" width="50" height="22" class="pin"/><text x="336" y="175" class="lbl">DC−</text>
  <rect x="330" y="220" width="50" height="22" class="pin"/><text x="336" y="235" class="lbl">IN1</text>
  <rect x="330" y="260" width="50" height="22" class="pin"/><text x="336" y="275" class="lbl">IN2</text>
  <rect x="330" y="300" width="50" height="22" class="pin"/><text x="336" y="315" class="lbl">IN3</text>
  <rect x="330" y="340" width="50" height="22" class="pin"/><text x="336" y="355" class="lbl">IN4</text>
  <text x="388" y="315" class="sub">n/c (spare)</text>
  <text x="388" y="355" class="sub">n/c (spare)</text>

  <!-- H/L jumper -->
  <rect x="400" y="410" width="120" height="50" rx="4" class="box"/>
  <text x="410" y="428" class="lbl">Trigger jumper</text>
  <rect x="410" y="436" width="14" height="14" class="pin"/><text x="414" y="447" class="sub">L</text>
  <rect x="440" y="436" width="14" height="14" class="pin"/>
  <rect x="470" y="436" width="14" height="14" class="pin"/><text x="474" y="447" class="sub">H</text>
  <rect x="438" y="433" width="48" height="20" rx="3" fill="none" stroke="#d62728" stroke-width="2"/>
  <text x="492" y="448" class="sub">← cap on COM–H</text>

  <!-- relays K1..K4 -->
  <!-- K1 -->
  <rect x="470" y="120" width="140" height="60" rx="4" class="relay"/>
  <text x="480" y="138" class="lbl" font-weight="bold">K1 (IN1) — TALLY</text>
  <rect x="620" y="122" width="48" height="16" class="pin"/><text x="626" y="134" class="sub">NC</text>
  <rect x="620" y="142" width="48" height="16" class="pin"/><text x="626" y="154" class="sub">COM</text>
  <rect x="620" y="162" width="48" height="16" class="pin"/><text x="626" y="174" class="sub">NO</text>
  <!-- K2 -->
  <rect x="470" y="210" width="140" height="60" rx="4" class="relay"/>
  <text x="480" y="228" class="lbl" font-weight="bold">K2 (IN2) — TALLY SEL</text>
  <rect x="620" y="212" width="48" height="16" class="pin"/><text x="626" y="224" class="sub">NC</text>
  <rect x="620" y="232" width="48" height="16" class="pin"/><text x="626" y="244" class="sub">COM</text>
  <rect x="620" y="252" width="48" height="16" class="pin"/><text x="626" y="264" class="sub">NO</text>
  <!-- K3 -->
  <rect x="470" y="300" width="140" height="40" rx="4" class="relay" opacity="0.5"/>
  <text x="480" y="324" class="lbl">K3 (IN3) — spare</text>
  <!-- K4 -->
  <rect x="470" y="350" width="140" height="40" rx="4" class="relay" opacity="0.5"/>
  <text x="480" y="374" class="lbl">K4 (IN4) — spare</text>

  <!-- ================= RJ-45 breakout ================= -->
  <rect x="790" y="60" width="190" height="300" rx="8" class="box"/>
  <text x="800" y="82" class="title">RJ‑45 breakout</text>
  <text x="800" y="98" class="sub">screw terminals → patch cable</text>
  <g class="lbl">
    <rect x="790" y="120" width="60" height="20" class="pin"/><text x="796" y="134">pin 1</text><text x="858" y="134" class="sub">org/wht · TALLY SEL</text>
    <rect x="790" y="148" width="60" height="20" class="pin" opacity="0.5"/><text x="796" y="162" fill="#999">pin 2</text>
    <rect x="790" y="176" width="60" height="20" class="pin" opacity="0.5"/><text x="796" y="190" fill="#999">pin 3</text>
    <rect x="790" y="204" width="60" height="20" class="pin" opacity="0.5"/><text x="796" y="218" fill="#999">pin 4</text>
    <rect x="790" y="232" width="60" height="20" class="pin" opacity="0.5"/><text x="796" y="246" fill="#999">pin 5</text>
    <rect x="790" y="260" width="60" height="20" class="pin"/><text x="796" y="274">pin 6</text><text x="858" y="274" class="sub">green · TALLY</text>
    <rect x="790" y="288" width="60" height="20" class="pin"/><text x="796" y="302">pin 7</text><text x="858" y="302" class="sub">brn/wht · ENABLE</text>
    <rect x="790" y="316" width="60" height="20" class="pin"/><text x="796" y="330">pin 8</text><text x="858" y="330" class="sub">brown · GND</text>
  </g>

  <!-- ================= Monitor ================= -->
  <rect x="1030" y="60" width="150" height="300" rx="8" class="mon"/>
  <text x="1040" y="82" class="title">JVC DT‑V17G1</text>
  <text x="1040" y="98" class="sub">REMOTE (MAKE/TRIGGER)</text>
  <rect x="1070" y="130" width="70" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="1085" y="160" class="lbl">RJ‑45</text>
  <text x="1040" y="215" class="note">Menu:</text>
  <text x="1040" y="231" class="note">• system = MAKE</text>
  <text x="1040" y="247" class="note">• pin 1 = TALLY SEL</text>
  <text x="1040" y="263" class="note">• TALLY SEL colour</text>
  <!-- tally lamp -->
  <circle cx="1105" cy="310" r="12" fill="#e33" stroke="#333"/>
  <circle cx="1140" cy="310" r="12" fill="#3c3" stroke="#333"/>
  <text x="1040" y="315" class="note">lamp</text>

  <!-- patch cable -->
  <path class="wire" stroke="#666" stroke-width="6" d="M980 155 C1010 155 1010 155 1070 155"/>
  <text x="985" y="145" class="sub">patch cable</text>

  <!-- ================= Wires Pi → relay board ================= -->
  <path class="wire w5v"  d="M210 131 H330"/>
  <path class="wire wgnd" d="M210 171 H330"/>
  <path class="wire w17"  d="M210 231 H330"/>
  <path class="wire w27"  d="M210 271 H330"/>
  <text x="240" y="124" class="sub" fill="#d62728">5 V</text>
  <text x="240" y="164" class="sub">GND</text>
  <text x="240" y="224" class="sub" fill="#ff7f0e">TALLY</text>
  <text x="240" y="264" class="sub" fill="#9467bd">TALLY SEL</text>

  <!-- ================= Wires relay contacts → breakout ================= -->
  <!-- K1 COM -> pin 6 -->
  <path class="wire wgrn" d="M668 150 H720 V270 H790"/>
  <!-- K1 NO -> pin 8 -->
  <path class="wire wbrn" d="M668 170 H740 V326 H790"/>
  <!-- K2 COM -> pin 1 -->
  <path class="wire worg" d="M668 240 H700 V130 H790"/>
  <!-- K2 NO -> pin 8 -->
  <path class="wire wbrn" d="M668 260 H740"/>
  <!-- ENABLE strap pin 7 -> pin 8 -->
  <path class="wire wbw" d="M790 298 H772 V326"/>
  <text x="722" y="352" class="sub">strap 7↔8</text>

  <!-- ================= Legend / notes ================= -->
  <rect x="20" y="500" width="1160" height="120" rx="8" class="box"/>
  <text x="30" y="522" class="title">Notes</text>
  <text x="30" y="544" class="note">• Relay contacts: use COM + NO (normally open). Open = function off; closed = pin shorted to GND (pin 8).</text>
  <text x="30" y="562" class="note">• Program (red): GPIO17 HIGH, GPIO27 LOW.  Preview (green): both HIGH.  Off: GPIO17 LOW.  K1 = TALLY on/off, K2 = colour select.</text>
  <text x="30" y="580" class="note">• Pin 7 (ENABLE) must be closed for TALLY SEL to be honoured → permanent strap to pin 8 on the breakout. Pin 6 alone works without it.</text>
  <text x="30" y="598" class="note">• Two energised relays ≈ 160 mA from the Pi 5 V rail. Jumper in H position → GPIO HIGH = relay on. If the optos won't trip at 3.3 V, set L and add --active-low to the tally-gpio service.</text>
  <text x="30" y="616" class="note">• Companion (other host) → HTTP GET http://tally-pi:8765/tally/mon1/red|green|off → tally-gpio service on the Pi → GPIO. Bench test: pi/test-tally.sh</text>
</svg>
